<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JemTech Business Card</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div class="cards">

        <!-- FRONT OF BUSINESS CARD -->
        <div class="card front">

            <!-- FRONT BACKGROUND -->
            <img src="frontJ.png" class="front-background" alt="JemTech Front Background">

            <!-- PHONE ICON -->
            <img src="blueCallicon.png" class="call-icon" alt="Phone Icon">

            <!-- CONTACT INFORMATION -->
            <div class="contact-info">
                <p>+09270820940</p>
                <p>James Claude P. Adona</p>
                <p>cl4ude0614@gmail.com</p>
                <p>James Claude Adona</p>
            </div>

            <!-- CIRCULAR LOGO AREA -->
            <div class="logo-circle front-logo-circle">
                <img src="logoJ.png" class="logo-image" alt="JemTech Logo">
            </div>

        </div>


        <!-- BACK OF BUSINESS CARD -->
        <div class="card back">

            <!-- BACKGROUND -->
            <img src="background.png" class="background" alt="JemTech Back Background">

            <!-- CIRCULAR LOGO AREA -->
            <div class="logo-circle back-logo-circle">
                <img src="logoJ.png" class="logo-image" alt="JemTech Logo">
            </div>

            <!-- QR CODE -->
            <img src="qrCode.png" class="qr-code" alt="JemTech QR Code">

            <!-- QR URL -->
            <div class="qr-url">
                https://www.google.com/search?q=JemTech
            </div>

        </div>

    </div>


    <!-- STUDENT INFORMATION -->
    <div class="student-info">

        <p>
            <strong>Name:</strong>
            James Claude P. Adona
        </p>

        <p>
            <strong>Subject:</strong>
            ITPE122
        </p>

        <p>
            <strong>Section:</strong>
            BSIT 2AC
        </p>

    </div>

</body>

</html>
